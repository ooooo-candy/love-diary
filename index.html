<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b9d" />
  <title>朝暮 · 恋爱记录</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="朝暮" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar__left">
        <div class="topbar__title" id="topbarTitle">我们的小日子</div>
        <div class="topbar__sub" id="topbarSub">记录在一起的每一天</div>
      </div>
      <button class="icon-btn" id="btnTheme" type="button" title="切换深色 / 浅色">🌙</button>
    </header>

    <main class="main" id="main">
      <section class="view" id="view-auth" hidden></section>
      <section class="view" id="view-home" hidden></section>
      <section class="view" id="view-timeline" hidden></section>
      <section class="view" id="view-album" hidden></section>
      <section class="view" id="view-stats" hidden></section>
    </main>

    <nav class="tabbar">
      <button class="tab is-active" type="button" data-tab="home"><i>🏠</i><span>首页</span></button>
      <button class="tab" type="button" data-tab="timeline"><i>🕰</i><span>时光轴</span></button>
      <div class="tab-slot">
        <button class="fab" id="fabAdd" type="button" aria-label="写一条记录">＋</button>
      </div>
      <button class="tab" type="button" data-tab="album"><i>🖼</i><span>相册</span></button>
      <button class="tab" type="button" data-tab="stats"><i>💞</i><span>我们</span></button>
    </nav>
  </div>

  <!-- 撰写 / 设置 弹层 -->
  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet__bar"><span></span></div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>

  <!-- 图片灯箱 -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" id="lbClose" type="button" aria-label="关闭">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" type="button" aria-label="上一张">‹</button>
    <img class="lightbox__img" id="lbImg" alt="" />
    <button class="lightbox__nav lightbox__nav--next" id="lbNext" type="button" aria-label="下一张">›</button>
    <div class="lightbox__caption" id="lbCaption"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script>
    window.APP_CONFIG = {
      mode: 'cloud',
      envId: 'kq620lm-d8gabmn69c500f017',
      httpBase: 'https://kq620lm-d8gabmn69c500f017-1503834579.ap-shanghai.app.tcloudbase.com/api'
    };
  </script>
  <script src="version.js" onerror="window.APP_VERSION=window.APP_VERSION||'dev'"></script>
  <script src="js/ui.js"></script>
  <script src="js/lunar.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/mock-cloud.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
